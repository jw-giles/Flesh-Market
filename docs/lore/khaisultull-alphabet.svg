"824" class="rom" style="font-size:12px">k</text><text x="314" y="838" class="val" style="font-size:9px">7</text><line x1="372" y1="806" x2="372" y2="827.08" stroke="var(--gl)" stroke-width="1.612" stroke-linecap="round"/><path d="M372 810.96 L376.34 807.86 L374.17 813.44" fill="none" stroke="var(--gl)" stroke-width="1.426" stroke-linejoin="round"/><path d="M372 819.02 L376.34 815.92 L374.17 821.5" fill="none" stroke="var(--gl)" stroke-width="1.426" stroke-linejoin="round"/><path d="M372 827.08 L376.34 823.98 L374.17 829.5600000000001" fill="none" stroke="var(--gl)" stroke-width="1.426" stroke-linejoin="round"/><path d="M372 822.12 L367.66 825.22 L369.83 819.64" fill="none" stroke="var(--gl)" stroke-width="1.426" stroke-linejoin="round"/><text x="388" y="824" class="rom" style="font-size:12px">f</text><text x="388" y="838" class="val" style="font-size:9px">13</text><line x1="446" y1="806" x2="446" y2="827.08" stroke="var(--gl)" stroke-width="1.612" stroke-linecap="round"/><path d="M446 810.96 L450.34 807.86 L448.17 813.44" fill="none" stroke="var(--gl)" stroke-width="1.426" stroke-linejoin="round"/><path d="M446 822.12 L441.66 825.22 L443.83 819.64" fill="none" stroke="var(--gl)" stroke-width="1.426" stroke-linejoin="round"/><text x="462" y="824" class="rom" style="font-size:12px">n</text><text x="462" y="838" class="val" style="font-size:9px">5</text><text class="note" x="40" y="876">Zharkofin, the Hivelord, reads 10 · 2 · 7 · 13 · 5 in base sixteen. He is the number 665557. So is every other name.</text>
<text class="note" x="40" y="756">No b, d, g or p. The brood has no voiced stop: k without g, t without d.</text>
<text class="note" x="40" y="772">A doubled sign doubles its value and must be preceded by a vowel. No word opens on one.</text>
<text class="note" x="40" y="788">A word is read left to right as base-sixteen digits. Every name is therefore an amount.</text>
